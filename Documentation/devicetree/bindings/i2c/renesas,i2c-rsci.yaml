%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/renesas,i2c-rsci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas Serial Communication Interface (RSCI) I2C Master Controller

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    - items:
        - enum:
            - renesas,r9a09g057-rz-rsci-i2c # RZ/V2H
            - renesas,r9a09g056-rz-rsci-i2c # RZ/V2N
        - enum:
            - renesas,rsci-i2c    # RSCI I2C mode

  reg:
    maxItems: 1

  interrupts:
    items:
        - description: Error Interrupt
        - description: Reception End Interrupt
        - description: Transmit End Interrupt
        - description: Completion Of Generation Of
                       A Start, Restart, Or Stop Condition (STI) Interrupt

  interrupt-names:
    items:
        - const: eri
        - const: rxi
        - const: txi
        - const: tei

  clock-frequency:
    description:
      Desired I2C bus clock frequency in Hz. The absence of this property
      indicates the default frequency 100 kHz.

  clocks:
    maxItems: 2

  clock-names:
    items:
      - const: fck
      - const: tclk

  resets:
    maxItems: 2

  reset-names:
    items:
      - const: presetn
      - const: tresetn

  power-domains:
    maxItems: 1

  status:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - power-domains
  - clock-frequency
  - status

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/renesas,r9a09g056-cpg.h>
    rsci_i2c0: i2c@12800c00 {
        compatible = "renesas,r9a09g056-rz-rsci-i2c",
              "renesas,rsci-i2c";
        reg = <0 0x12800c00 0 0x400>;
        interrupts = <GIC_SPI 114 IRQ_TYPE_LEVEL_HIGH>,
              <GIC_SPI 115 IRQ_TYPE_EDGE_RISING>,
              <GIC_SPI 116 IRQ_TYPE_EDGE_RISING>,
              <GIC_SPI 117 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "eri", "rxi", "txi", "tei";
        clocks = <&cpg CPG_MOD 0x5d>, <&cpg CPG_MOD 0x5e>;
        clock-names = "fck", "tclk";
        power-domains = <&cpg>;
        resets = <&cpg 0x81>, <&cpg 0x82>;
        reset-names = "presetn", "tresetn";
        status = "disabled";
    };
