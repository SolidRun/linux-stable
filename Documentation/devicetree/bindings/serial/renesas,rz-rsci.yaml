%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/renesas,rz-rsci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas Serial Communication Interface (RSCI)

allOf:
  - $ref: serial.yaml#

properties:
  compatible:
    items:
        - enum:
            - renesas,r9a09g057-rz-rsci # RZ/V2N
            - renesas,r9a09g056-rz-rsci # RZ/V2N
        - enum:
            - renesas,rz-rsci           # RSCI UART mode
            - renesas,rz-rscif          # RSCI UART mode with FIFO

  reg:
    maxItems: 1

  interrupts:
    oneOf:
      - items:
          - description: Error Interrupt
          - description: Receive Data Full Interrupt
          - description: Transmit Data Empty Interrupt
          - description: Transmit End Interrupt

  interrupt-names:
    oneOf:
      - items:
          - const: eri
          - const: rxi
          - const: txi
          - const: tei

  clocks:
    maxItems: 2

  clock-names:
    items:
      - const: fck
      - const: tclk

  resets:
    maxItems: 2

  reset-names:
    items:
      - const: presetn
      - const: tresetn

  power-domains:
    maxItems: 1

  num-cs:
    maxItems: 1

  status:
    maxItems: 1

  uart-has-rtscts: true

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - power-domains
  - status

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/renesas,r9a09g056-cpg.h>
    sci0: serial@12800c00 {
        compatible = "renesas,r9a09g056-rz-rsci", "renesas,rz-rscif";
        reg = <0 0x12800c00 0 0x400>;
        interrupts = <GIC_SPI 114 IRQ_TYPE_LEVEL_HIGH>,
              <GIC_SPI 115 IRQ_TYPE_EDGE_RISING>,
              <GIC_SPI 116 IRQ_TYPE_EDGE_RISING>,
              <GIC_SPI 117 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "eri", "rxi", "txi", "tei";
        clocks = <&cpg CPG_MOD 0x5d>, <&cpg CPG_MOD 0x5e>;
        clock-names = "fck", "tclk";
        power-domains = <&cpg>;
        resets = <&cpg 0x81>, <&cpg 0x82>;
        reset-names = "presetn", "tresetn";
        status = "disabled";
    };
