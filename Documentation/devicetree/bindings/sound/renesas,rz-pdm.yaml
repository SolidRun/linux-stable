%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/renesas,rz-pdm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas RZ ASoC Pulse Density Modulation Interface Driver (PDM)

properties:
  compatible:
    items:
      - const: renesas,rz-pdm

  reg:
    maxItems: 1

  interrupts:
    maxItems: 7

  interrupt-names:
    items:
      - const: int_pdm_err0, int_pdm_err1, int_pdm_err2
      - const: int_pdm_dat0, int_pdm_dat1, int_pdm_dat2
      - const: int_pdm_sdet

  clocks:
    maxItems: 3

  clock-names:
    items:
      - const: pdm_pclk
      - const: pdm_pclk_sfr
      - const: pdm_cclk

  power-domains:
    maxItems: 1

  resets:
    maxItems: 2

  resets-names:
    items:
      - const: pclk
      - const: cclk

  dmas:
    minItems: 1
    maxItems: 3
    description:
      The first cell represents a phandle to dmac.
      The second cell specifies DMAC REQ values of the PDM channel
      configuration connected to ICU parameters.
      bits[0:9]   - Specifies DMAC REQ value of PDM channel as below
                    DMAC REQ value of PDM0_0 rx0 = 0x0C2
                    DMAC REQ value of PDM0_1 rx1 = 0x0C3
                    DMAC REQ value of PDM0_2 rx2 = 0x0C4
                    DMAC REQ value of PDM1_0 rx0 = 0x0C5
                    DMAC REQ value of PDM1_1 rx1 = 0x0C6
                    DMAC REQ value of PDM1_2 rx2 = 0x0C7
      bit[10]     - HIEN = 1, Detects a request in response to the rising edge
                    of the signal
      bit[11]     - LVL = 1, Detects the level of a DMA request
      bits[12:14] - AM = 2, ACK bus cycle output
      bit[15]     - TM = 0, Single transfer mode
      bits[22:16] - Specifies DMAACK output number : not use define as 7F (all 1)

  dma-names:
    oneOf:
      - items:
          - const: rx0
          - const: rx1
          - const: rx2

  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - resets
  - '#sound-dai-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/r9a08g046-cpg.h>

	pdm: pdm@1005a000 {
		compatible = "renesas,rz-pdm";
		reg = <0 0x1005a000 0 0x400>;
		interrupts = <GIC_SPI 476 IRQ_TYPE_LEVEL_HIGH>,
			     <GIC_SPI 477 IRQ_TYPE_LEVEL_HIGH>,
			     <GIC_SPI 478 IRQ_TYPE_LEVEL_HIGH>,
			     <GIC_SPI 479 IRQ_TYPE_LEVEL_HIGH>,
			     <GIC_SPI 480 IRQ_TYPE_LEVEL_HIGH>,
			     <GIC_SPI 481 IRQ_TYPE_LEVEL_HIGH>,
			     <GIC_SPI 482 IRQ_TYPE_LEVEL_HIGH>;
		interrupt-names = "int_pdm_err0", "int_pdm_err1", "int_pdm_err2",
				  "int_pdm_dat0", "int_pdm_dat1", "int_pdm_dat2",
				  "int_pdm_sdet";
		clocks = <&cpg CPG_MOD R9A08G046_PDM_PCLK>,
			 <&cpg CPG_MOD R9A08G046_PDM_CCLK>;
		clock-names = "pdm_pclk", "pdm_cclk";
		resets = <&cpg R9A08G046_PDM_PRESETN>;
		reset-names = "pclk";
		dmas = <&dmac1 0x7F2CC2>, <&dmac1 0x7F2CC3>, <&dmac1 0x7F2CC4>;
		dma-names = "rx0", "rx1", "rx2";
		power-domains = <&cpg>;
		#sound-dai-cells = <0>;
		status = "disabled";

		channel0 {
			status = "disabled";
		};
		channel1 {
			status = "disabled";
		};
		channel2 {
			status = "disabled";
		};
	};
