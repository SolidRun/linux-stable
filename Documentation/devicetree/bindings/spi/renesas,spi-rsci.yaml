%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/renesas,spi-rsci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas Serial Communication Interface (RSCI) SPI Controller

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    - items:
        - enum:
            - renesas,r9a09g057-rz-rsci-spi # RZ/V2H
            - renesas,r9a09g056-rz-rsci-spi # RZ/V2N
        - enum:
            - renesas,rsci-spi              # RSCI SPI mode

  reg:
    maxItems: 1

  interrupts:
    oneOf:
      - items:
          - description: Error Interrupt
          - description: Receive Data Full Interrupt
          - description: Transmit Data Empty Interrupt
          - description: Transmit End Interrupt

  interrupt-names:
    oneOf:
      - items:
          - const: eri
          - const: rxi
          - const: txi
          - const: tei

  clocks:
    maxItems: 2

  clock-names:
    items:
      - const: fck
      - const: tclk

  resets:
    maxItems: 2

  reset-names:
    items:
      - const: presetn
      - const: tresetn

  dmas:
    maxItems: 2

  dma-names:
    items:
      - const: tx
      - const: rx

  power-domains:
    maxItems: 1

  num-cs:
    maxItems: 1

  status:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - dmas
  - dma-names
  - power-domains
  - num-cs
  - '#address-cells'
  - '#size-cells'
  - status

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/renesas,r9a09g056-cpg.h>
    rsci_spi0: spi@12800c00 {
        compatible = "renesas,r9a09g056-rz-rsci-spi",
              "renesas,rsci-spi";
        reg = <0 0x12800c00 0 0x400>;
        interrupts = <GIC_SPI 114 IRQ_TYPE_LEVEL_HIGH>,
              <GIC_SPI 115 IRQ_TYPE_EDGE_RISING>,
              <GIC_SPI 116 IRQ_TYPE_EDGE_RISING>,
              <GIC_SPI 117 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "eri", "rxi", "txi", "tei";
        clocks = <&cpg CPG_MOD 0x5d>, <&cpg CPG_MOD 0x5e>;
        clock-names = "fck", "tclk";
        power-domains = <&cpg>;
        resets = <&cpg 0x81>, <&cpg 0x82>;
        reset-names = "presetn", "tresetn";
        dmas = <&dmac1 0x7F4493>, <&dmac1 0x7F4492>;
        dma-names = "tx", "rx";
        num-cs = <1>;
        #address-cells = <1>;
        #size-cells = <0>;
        status = "disabled";
    };
