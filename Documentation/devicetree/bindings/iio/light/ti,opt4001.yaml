%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/ti,opt4001.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TI OPT4001 Ambient Light Sensor

maintainers:
  - Stefan Windfeldt-Prytz <stefan.windfeldt-prytz@axis.com>

description: |
  Ambient light sensor on I2C bus with lux measurement. The two supported
  compatible strings select the packaging-specific constants used to
  calculate the lux value.

  Datasheet: https://www.ti.com/lit/gpn/opt4001

properties:
  compatible:
    enum:
      - ti,opt4001-sot-5x3
      - ti,opt4001-picostar

  reg:
    maxItems: 1

  vdd-supply: true

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - vdd-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        light-sensor@44 {
            compatible = "ti,opt4001-sot-5x3";
            reg = <0x44>;
            vdd-supply = <&vcc_3v3>;
            interrupt-parent = <&gpio3>;
            interrupts = <23 IRQ_TYPE_EDGE_FALLING>;
        };
    };
